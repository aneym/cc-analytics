name: Check Claude Code Hook Updates

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force check even if version unchanged'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get latest Claude Code version
        id: cc-version
        run: |
          VERSION=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Claude Code version: $VERSION"

      - name: Check cached version
        id: cache-check
        run: |
          CACHED_VERSION=""
          if [ -f ".claude-code-version" ]; then
            CACHED_VERSION=$(cat .claude-code-version)
          fi
          echo "cached=$CACHED_VERSION" >> $GITHUB_OUTPUT

          if [ "$CACHED_VERSION" = "${{ steps.cc-version.outputs.version }}" ] && [ "${{ inputs.force_check }}" != "true" ]; then
            echo "needs_check=false" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping check"
          else
            echo "needs_check=true" >> $GITHUB_OUTPUT
            echo "Version changed or force check enabled"
          fi

      - name: Run schema check
        if: steps.cache-check.outputs.needs_check == 'true'
        id: schema-check
        continue-on-error: true
        run: |
          OUTPUT=$(bun run scripts/check-hook-schema.ts 2>&1) || true
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$OUTPUT" | grep -q "Schema differences detected"; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate updates with Claude Code
        if: steps.schema-check.outputs.has_diff == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The Claude Code hook schema has changed. Please update the types and collector to match.

            Schema differences detected:
            ${{ steps.schema-check.outputs.output }}

            Tasks:
            1. Update src/types.ts to add any missing events or fix interface fields
            2. Update src/collector.ts to handle any new events
            3. Update hooks/hooks.json to register any new events
            4. Update scripts/schema-baseline.json to reflect the new expected schema

            After making changes, run `bun run check` to verify the code compiles and passes lint.

      - name: Update version cache
        if: steps.cache-check.outputs.needs_check == 'true'
        run: echo "${{ steps.cc-version.outputs.version }}" > .claude-code-version

      - name: Create Pull Request
        if: steps.schema-check.outputs.has_diff == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update hook schema for Claude Code ${{ steps.cc-version.outputs.version }}'
          title: 'chore: Update hook schema for Claude Code ${{ steps.cc-version.outputs.version }}'
          body: |
            ## Summary
            Automated update to hook schema based on Claude Code version ${{ steps.cc-version.outputs.version }}.

            ### Changes detected
            ```
            ${{ steps.schema-check.outputs.output }}
            ```

            ### Generated by
            This PR was automatically generated by the check-hook-updates workflow using Claude Code Action.

            ---
            🤖 Generated with [Claude Code](https://claude.ai/code)
          branch: chore/update-hook-schema-${{ steps.cc-version.outputs.version }}
          draft: true
          labels: |
            automated
            schema-update
